<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alias-Verwaltung</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
           background: #f4f5f7; color: #1c1e21; }
    @media (prefers-color-scheme: dark) {
      body { background: #17181c; color: #e6e6e6; }
      .card { background: #22242a !important; }
      header { background: #22242a !important; }
      input, select { background: #17181c; color: #e6e6e6;
                      border-color: #444 !important; }
      table td, table th { border-color: #3a3d44 !important; }
    }
    header { background: #fff; padding: .8rem 1.2rem; display: flex;
             justify-content: space-between; align-items: center;
             box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    header h1 { font-size: 1.1rem; margin: 0; }
    main { max-width: 780px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1.2rem;
            margin-bottom: 1.2rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { font-size: 1rem; margin-top: 0; }
    .muted { opacity: .65; font-size: .85rem; }
    input, select { padding: .45rem .6rem; border: 1px solid #ccc;
                    border-radius: 6px; font-size: .95rem; }
    button { padding: .45rem .9rem; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; font-size: .95rem;
             cursor: pointer; }
    button.danger { background: #dc2626; }
    button.warn { background: #d97706; }
    button.link-like { background: transparent; color: inherit;
                       text-decoration: underline; padding: 0; }
    form.inline { display: inline; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: .5rem .4rem;
             border-bottom: 1px solid #e5e7eb; font-size: .92rem; }
    .flash { padding: .6rem .9rem; border-radius: 6px; margin-bottom: .8rem;
             font-size: .92rem; }
    .flash.success { background: #dcfce7; color: #14532d; }
    .flash.error { background: #fee2e2; color: #7f1d1d; }
    @media (prefers-color-scheme: dark) {
      .flash.success { background: #14532d; color: #dcfce7; }
      .flash.error { background: #7f1d1d; color: #fee2e2; }
    }
    code { background: rgba(127,127,127,.15); padding: .1rem .3rem;
           border-radius: 4px; }
  </style>
</head>
<body>
<header>
  <h1>Alias-Verwaltung</h1>
  {% if session.user %}
  <form class="inline" method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <span class="muted">{{ session.user }}</span>
    <button type="submit" class="link-like">Abmelden</button>
  </form>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
